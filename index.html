<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Stuff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<!-- The Bootstrap CSS file... CDN stand for content delivery network -->
</head>
<body>
    <!-- bootstrap work by adding classes to HTML for example, break points (xs, sm, md, lg, xl, 2xl)
     background (bg)
     foregrounds (fg)- for text -->
    <div class="lg:container bg-primary fg-contrast-primary">
    <header>
        <h1>New Bootstrap 6!</h1>
    </header>
    <main>
      <button type="button" class="btn-solid theme-accent" commandfor="invokerDrawer" command="show-modal">
       Open drawer 
       </button>
       <dialog class="drawer drawer-start" tabindex="-1" id="invokerDrawer" aria-labelledby="invokerDrawerLabel">
       <div class="drawer-header">
       <h5 class="drawer-title" id="invokerDrawerLabel">This is a Drawer</h5>
       <button type="button" class="btn-close" commandfor="invokerDrawer" command="close" aria-label="Close"></button>
       </div>
     <div class="drawer-body">
        <p> Hello World! Today is a beautiful day.</p>
     </div>
     </dialog>

     <form>
        <div class="form-field">
         <label class="form-label">Terms and conditions</label>
         <input type="checkbox" id="fieldOverheadCheck" class="check" required />
         <div class="form-field-content">
         <label for="fieldOverheadCheck">I agree to the terms</label>
         <small class="form-text">Please read before agreeing.</small>
        </div>
     </form>
     </div>

     <form>
        <span class="chip">Code Blue</span>
        <span class="chip">
         <img src="https://github.com/mdo.png" class="chip-img" width="16" height="16" alt="">
          Criminally Accurate
         </span>
          <span class="chip">
          <span class="chip-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
         </svg>
         </span>
         locked
         </span>
         <span class="chip">
         ibismile
         <button type="button" class="chip-dismiss" aria-label="Remove">
         <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></svg>
         </button>
         </span>

     </form>
    </main>

    <section>
        <!-- bootstraps grid! the grid is a 12-col grid (which you can se columns to be different sizes around) 
         p-3 is oadding -0.5em - you can have padding classes and margin classes (ie. m-8)-->
        <div class="row bg-danger fg-contrast-danger">
            <div class="md:col-8 p-3">1 column</div>
            <div class="md:col p-3">2 column</div>
            <div class="md:col p-3">3 column</div>
        </div>

    </section>
</div>



<!-- bootstrap javascript file -->
 <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
